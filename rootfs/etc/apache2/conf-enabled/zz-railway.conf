# Small prefork pool so Faved fits Railway's 0.5 GB Free-plan limit.
# Override with APACHE_MAX_WORKERS (set by the start script).
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         1
    MaxSpareServers         3
    ServerLimit             ${APACHE_MAX_WORKERS}
    MaxRequestWorkers       ${APACHE_MAX_WORKERS}
    MaxConnectionsPerChild  500
</IfModule>
ServerTokens Prod
ServerSignature Off
ErrorLog /proc/self/fd/2
LogFormat "%{X-Real-IP}i %l %u %t \"%r\" %>s %b" railway
CustomLog /proc/self/fd/1 railway "expr=%{REQUEST_URI} != '/healthz'"
