# Upstream apache-conf/faved.conf (v2.10.1) with Railway changes: port from $PORT,
# HTTPS detected from Railway's proxy, and a /healthz route.
<VirtualHost *:${PORT}>
    ServerName faved

    DocumentRoot "/var/www/html/public"

    # Railway terminates TLS; tell PHP the request was HTTPS so session cookies are Secure.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <IfModule xsendfile_module>
        XSendFilePath "/var/www/html/public"
    </IfModule>

    <IfModule mod_rewrite.c>
        RewriteEngine On

        # Railway health check (no login needed; says nothing about your data)
        RewriteRule ^/healthz$ healthz.php [L]

        # Serve existing files or directories directly
        RewriteCond %{DOCUMENT_ROOT}/dist%{REQUEST_URI} -f [OR]
        RewriteCond %{DOCUMENT_ROOT}/dist%{REQUEST_URI} -d
        RewriteRule ^(.*)$ /dist/$1 [L]

        # Redirect '/api' prefixed path to api/index.php
        RewriteRule ^/api(/.*|)$ api/index.php [L]
        RewriteRule ^/content(/.*|)$ api/index.php [L]

        # Redirect all other paths to index.html
        RewriteRule ^ dist/index.html [L]
    </IfModule>

    <Directory "/var/www/html/public">
        Options Includes FollowSymLinks ExecCGI
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
